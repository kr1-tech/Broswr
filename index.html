<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Browser UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f0f0;
        }

        /* Toolbar Styling */
        .toolbar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background-color: #e0e0e0;
            border-bottom: 1px solid #ccc;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border: 1px solid #ababab;
            background-color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #eaeaea;
        }

        .address-bar {
            flex-grow: 1;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        /* Viewport Container */
        .viewport-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 45px);
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Browser Controls Toolbar -->
    <div class="toolbar">
        <button class="btn" id="refreshBtn">↻ Reload</button>
        <form id="urlForm" style="display: flex; flex-grow: 1; gap: 8px;">
            <input 
                type="text" 
                id="addressBar" 
                class="address-bar" 
                placeholder="Enter URL (e.g., https://example.com)" 
                required 
            />
            <button type="submit" class="btn">Go</button>
        </form>
    </div>

    <!-- Main Content Area -->
    <div class="viewport-container">
        <iframe id="viewport" src="about:blank" title="Browser Viewport"></iframe>
    </div>

    <script>
        const urlForm = document.getElementById('urlForm');
        const addressBar = document.getElementById('addressBar');
        const viewport = document.getElementById('viewport');
        const refreshBtn = document.getElementById('refreshBtn');

        // Handle URL Submission
        urlForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let inputUrl = addressBar.value.trim();

            // Automatically append https:// if missing scheme
            if (!/^https?:\/\//i.test(inputUrl)) {
                inputUrl = 'https://' + inputUrl;
                addressBar.value = inputUrl;
            }

            // Update iframe src attribute
            viewport.src = inputUrl;
        });

        // Reload current page
        refreshBtn.addEventListener('click', () => {
            if (viewport.src && viewport.src !== 'about:blank') {
                viewport.src = viewport.src;
            }
        });
    </script>

</body>
</html>
